name: yarrow-boulevard
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0,6,12,18 * * *'
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: chmod +x build_script.sh && ./build_script.sh
